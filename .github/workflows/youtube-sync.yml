name: Sync with YouTube

on:
  schedule:
    - cron: "17 */3 * * *"     # every 3 hours
  workflow_dispatch: {}        # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency: youtube-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U yt-dlp
      - run: python tools/sync_youtube.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- youtube.js && git ls-files --error-unmatch youtube.js >/dev/null 2>&1; then
            echo "No change"; exit 0
          fi
          git config user.name "youtube-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube.js
          git commit -m "Sync with YouTube"
          git push
